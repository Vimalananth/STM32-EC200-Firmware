name: pump_controller
description: Pump remote control app with Firebase

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core:      ^4.12.1
  firebase_database:  ^12.4.6
  firebase_auth:      ^6.5.6
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0
  fl_chart:                   ^1.2.0
  shared_preferences:         ^2.3.2
  url_launcher:               ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
